version: '3.8'

services:
  sentineldesk-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentineldesk_api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - LLM_PROVIDER=gemini
      - LLM_MODEL=gemini-2.0-flash
      - CHROMADB_HOST=localhost
      - CHROMADB_PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
