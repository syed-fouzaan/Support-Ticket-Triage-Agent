<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230f172a'><circle cx='12' cy='12' r='10' stroke-width='2' stroke='#e2e8f0' fill='none'/></svg>">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SentinelDesk — Minimal Support Operations Platform</title>
    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f172a">
  </head>
  <body class="bg-[#F4F6F9] text-slate-900 font-sans antialiased selection:bg-slate-900 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (reg) => console.log('[SW] SentinelDesk Service Worker registered:', reg.scope),
            (err) => console.warn('[SW] Registration failed:', err)
          );
        });
      }
    </script>
  </body>
</html>
